<html lang="en">

<head>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="spawn-camp-style.css">

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots" content="noindex, nofollow">

    <title>Spawn Camp — Bracket</title>
</head>

<body>

    <header class="site-header">

        <div class="header-inner">

            <a href="index.html" class="logo">
                <img src="wackyboyzlogo-orange.png" alt="Home">
            </a>

            <nav>
                <a href="index.html">Home</a>
                <a href="spawn-camp.html">Spawn Camp</a>

            </nav>

        <section class="sc-page-header">

            <span class="section-line"></span>

            <p>BRACKET</p>


        </section>


        <section class="bracket-section">

            <div class="bracket-header">

                <div>
                    <h2>2026 BRACKET</h2>

                    <p id="bracket-status">
                        Loading bracket...
                    </p>
                </div>

                <a href="spawn-camp-stats.html" class="sc-button">
                    View Stats
                </a>

            </div>

                <div class="bracket-loading">
                    Loading tournament data...
                </div>

            </div>

        </section>

    </main>


    <footer class="sc-footer">
        <p>&copy; 2026 Wacky Boyz</p>
    </footer>


<script>

// ==========================================
// SPAWN CAMP BRACKET
// ==========================================

let currentBracketMatches = [];

const API_URL =
    "https://script.google.com/macros/s/AKfycbznLKEc0ATrYConMYRstm9h0zlsoPVOpaW9MFeiVCNhSXpK1Sp6u6oW7dK6UHxjqBIh/exec";


const bracketContainer =
    document.getElementById("bracket-container");


const bracketStatus =
    document.getElementById("bracket-status");



// ==========================================
// REMOVE OLD CONNECTOR GRAPHICS
// ==========================================

function removeOldBracketGraphics() {

    document
        .querySelectorAll(
            ".bracket-connections, " +
            ".bracket-cross-connections, " +
            ".sc-bracket-local-lines, " +
            ".sc-bracket-cross-lines, " +
            ".sc-grand-final-lines, " +
            ".sc-grand-final"
        )
        .forEach(
            function(element) {

                element.remove();

            }
        );

}



// ==========================================
// LOAD BRACKET DATA
// ==========================================

async function loadBracket() {

    try {

        const response =
            await fetch(
                API_URL + "?action=bracket",
                {
                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const result =
            await response.json();


        if (
            !result ||
            !result.success
        ) {

            throw new Error(
                result?.error ||
                "Unable to load bracket."
            );

        }


        if (
            !Array.isArray(
                result.data
            )
        ) {

            throw new Error(
                "Bracket data was not returned as an array."
            );

        }


        renderBracket(
            result.data
        );


    } catch (error) {

        console.error(
            "Bracket error:",
            error
        );


        bracketStatus.textContent =
            "Unable to load tournament data.";


        bracketContainer.innerHTML = `

            <div class="bracket-error">

                <h3>
                    Bracket unavailable
                </h3>

                <p>
                    We couldn't load the tournament
                    bracket right now. Please try again later.
                </p>

            </div>

        `;

    }

}



// ==========================================
// RENDER BRACKET
// ==========================================

function renderBracket(
    rawMatches
) {

    removeOldBracketGraphics();


    bracketContainer.innerHTML = "";


    bracketContainer.style.position =
        "relative";


    // ==========================================
    // EMPTY STATE
    // ==========================================

    if (
        !rawMatches ||
        rawMatches.length === 0
    ) {

        currentBracketMatches = [];


        bracketStatus.textContent =
            "No matches have been added yet.";


        bracketContainer.innerHTML = `

            <div class="bracket-empty">

                <h3>
                    BRACKET COMING SOON
                </h3>

                <span class="section-line"></span>

                <p>
                    The tournament bracket will appear here
                    once teams have been finalized.
                </p>

            </div>

        `;

        return;

    }


    // ==========================================
    // NORMALIZE DATA
    // ==========================================

    currentBracketMatches =
        rawMatches.map(
            normalizeMatch
        );


    // ==========================================
    // SEPARATE WINNERS / LOSERS
    // ==========================================

    const winnersMatches =
        currentBracketMatches.filter(
            function(match) {

                return (
                    normalizeText(
                        match.Bracket
                    ) ===
                    "winners"
                );

            }
        );


    const losersMatches =
        currentBracketMatches.filter(
            function(match) {

                return (
                    normalizeText(
                        match.Bracket
                    ) ===
                    "losers"
                );

            }
        );


    // ==========================================
    // STATUS
    // ==========================================

    const winnersRounds =
        getUniqueRounds(
            winnersMatches
        );


    const losersRounds =
        getUniqueRounds(
            losersMatches
        );


    const totalRounds =
        winnersRounds.length +
        losersRounds.length;


    bracketStatus.textContent =
        `${currentBracketMatches.length} matches • ${totalRounds} rounds • LIVE`;


    // ==========================================
    // WINNERS BRACKET
    // ==========================================

    if (
        winnersMatches.length
    ) {

        bracketContainer.appendChild(

            createBracketSection(
                "WINNERS BRACKET",
                winnersMatches,
                "winners"
            )

        );

    }


    // ==========================================
    // LOSERS BRACKET
    // ==========================================

    if (
        losersMatches.length
    ) {

        bracketContainer.appendChild(

            createBracketSection(
                "LOSERS BRACKET",
                losersMatches,
                "losers"
            )

        );

    }


    // ==========================================
    // INITIAL LAYOUT
    // ==========================================

    requestAnimationFrame(
        function() {

            requestAnimationFrame(
                function() {

                    layoutBrackets();

                }
            );

        }
    );

}



// ==========================================
// NORMALIZE MATCH
// ==========================================

function normalizeMatch(
    match
) {

    return {

        MatchID:
            cleanValue(
                match["Match ID"]
            ),

        Bracket:
            cleanValue(
                match["Bracket"]
            ),

        Round:
            cleanValue(
                match["Round"]
            ),

        MatchNumber:
            cleanValue(
                match["Match Number"]
            ),

        Team1:
            cleanValue(
                match["Team 1"]
            ),

        Team2:
            cleanValue(
                match["Team 2"]
            ),

        Score1:
            cleanValue(
                match["Team 1 Score"]
            ),

        Score2:
            cleanValue(
                match["Team 2 Score"]
            ),

        Winner:
            cleanValue(
                match["Winner"]
            ),

        Status:
            cleanValue(
                match["Status"]
            ),

        NextMatchID:
            cleanValue(
                match["Next Match ID"]
            ),

        LoserNextMatchID:
            cleanValue(
                match["Loser Next Match ID"]
            )

    };

}



// ==========================================
// CLEAN VALUE
// ==========================================

function cleanValue(
    value
) {

    if (
        value === null ||
        value === undefined
    ) {

        return "";

    }


    return String(
        value
    ).trim();

}



// ==========================================
// NORMALIZE TEXT
// ==========================================

function normalizeText(
    value
) {

    return cleanValue(
        value
    )
        .toLowerCase()
        .replace(
            /[\s_-]+/g,
            ""
        );

}



// ==========================================
// GET UNIQUE ROUNDS
// ==========================================

function getUniqueRounds(
    matches
) {

    return [

        ...new Set(

            matches
                .map(
                    function(match) {

                        return cleanValue(
                            match.Round
                        );

                    }
                )
                .filter(
                    function(round) {

                        return round !== "";

                    }
                )

        )

    ].sort(
        function(a, b) {

            return (
                Number(a) -
                Number(b)
            );

        }
    );

}



// ==========================================
// FIND MATCH BY REFERENCE
// ==========================================

function findMatchByReference(
    reference
) {

    const target =
        normalizeText(
            reference
        );


    if (
        target === ""
    ) {

        return null;

    }


    return (

        currentBracketMatches.find(
            function(match) {

                return (
                    normalizeText(
                        match.MatchID
                    ) ===
                    target
                );

            }
        )

        ||

        null

    );

}



// ==========================================
// FIND WINNERS FINAL
// ==========================================
//
// Highest round in Winners bracket.
// ==========================================

function findWinnersFinal() {

    const winners =
        currentBracketMatches
            .filter(
                function(match) {

                    return (
                        normalizeText(
                            match.Bracket
                        ) ===
                        "winners"
                    );

                }
            );


    if (
        !winners.length
    ) {

        return null;

    }


    const highestRound =
        Math.max.apply(
            null,
            winners.map(
                function(match) {

                    return Number(
                        match.Round
                    );

                }
            )
        );


    const finalMatches =
        winners.filter(
            function(match) {

                return (
                    Number(match.Round) ===
                    highestRound
                );

            }
        );


    return (
        finalMatches.length
            ? finalMatches[
                finalMatches.length - 1
            ]
            : null
    );

}



// ==========================================
// FIND LOSERS FINAL
// ==========================================
//
// Highest round in Losers bracket.
// ==========================================

function findLosersFinal() {

    const losers =
        currentBracketMatches
            .filter(
                function(match) {

                    return (
                        normalizeText(
                            match.Bracket
                        ) ===
                        "losers"
                    );

                }
            );


    if (
        !losers.length
    ) {

        return null;

    }


    const highestRound =
        Math.max.apply(
            null,
            losers.map(
                function(match) {

                    return Number(
                        match.Round
                    );

                }
            )
        );


    const finalMatches =
        losers.filter(
            function(match) {

                return (
                    Number(match.Round) ===
                    highestRound
                );

            }
        );


    return (
        finalMatches.length
            ? finalMatches[
                finalMatches.length - 1
            ]
            : null
    );

}



// ==========================================
// FIND GRAND FINAL SHEET MATCH
// ==========================================

function findGrandFinalSheetMatch() {

    return (

        currentBracketMatches.find(
            function(match) {

                const id =
                    normalizeText(
                        match.MatchID
                    );


                const bracket =
                    normalizeText(
                        match.Bracket
                    );


                return (

                    id === "finals" ||
                    id === "final" ||
                    id === "grandfinal" ||

                    bracket === "finals" ||
                    bracket === "grandfinal"

                );

            }
        )

        ||

        null

    );

}



// ==========================================
// GET MATCH WINNER
// ==========================================

function getMatchWinner(
    match
) {

    if (
        !match
    ) {

        return "";

    }


    // ------------------------------------------
    // Use Winner column first.
    // ------------------------------------------

    if (
        match.Winner !== ""
    ) {

        return match.Winner;

    }


    // ------------------------------------------
    // Don't infer incomplete matches.
    // ------------------------------------------

    if (
        normalizeText(
            match.Status
        ) !==
        "complete"
    ) {

        return "";

    }


    const score1 =
        Number(
            match.Score1
        );


    const score2 =
        Number(
            match.Score2
        );


    if (
        !Number.isFinite(
            score1
        ) ||
        !Number.isFinite(
            score2
        )
    ) {

        return "";

    }


    if (
        score1 >
        score2
    ) {

        return match.Team1;

    }


    if (
        score2 >
        score1
    ) {

        return match.Team2;

    }


    return "";

}



// ==========================================
// GET GRAND FINAL PARTICIPANTS
// ==========================================

function getGrandFinalParticipants() {

    const winnersFinal =
        findWinnersFinal();


    const losersFinal =
        findLosersFinal();


    return {

        winnersTeam:
            getMatchWinner(
                winnersFinal
            ),

        losersTeam:
            getMatchWinner(
                losersFinal
            )

    };

}



// ==========================================
// CREATE BRACKET SECTION
// ==========================================

function createBracketSection(
    title,
    matches,
    bracketType
) {

    const section =
        document.createElement(
            "div"
        );


    section.className =
        "bracket-group";


    section.dataset.bracket =
        bracketType;


    section.style.position =
        "relative";


    // ------------------------------------------
    // TITLE
    // ------------------------------------------

    const heading =
        document.createElement(
            "h2"
        );


    heading.className =
        "bracket-group-title";


    heading.textContent =
        title;


    section.appendChild(
        heading
    );


    // ------------------------------------------
    // ROUNDS CONTAINER
    // ------------------------------------------

    const roundsContainer =
        document.createElement(
            "div"
        );


    roundsContainer.className =
        "bracket-rounds";


    roundsContainer.style.position =
        "relative";


    roundsContainer.style.overflow =
        "visible";


    const rounds =
        getUniqueRounds(
            matches
        );


    rounds.forEach(
        function(round) {

            const roundMatches =
                matches
                    .filter(
                        function(match) {

                            return (
                                String(match.Round) ===
                                String(round)
                            );

                        }
                    )
                    .sort(
                        function(a, b) {

                            const aNumber =
                                Number(
                                    a.MatchNumber
                                );


                            const bNumber =
                                Number(
                                    b.MatchNumber
                                );


                            if (
                                Number.isFinite(
                                    aNumber
                                ) &&
                                Number.isFinite(
                                    bNumber
                                )
                            ) {

                                return (
                                    aNumber -
                                    bNumber
                                );

                            }


                            return 0;

                        }
                    );


            roundsContainer.appendChild(

                createRound(
                    round,
                    roundMatches,
                    bracketType
                )

            );

        }
    );


    section.appendChild(
        roundsContainer
    );


    return section;

}



// ==========================================
// CREATE ROUND
// ==========================================

function createRound(
    round,
    matches,
    bracketType
) {

    const roundElement =
        document.createElement(
            "div"
        );


    roundElement.className =
        "bracket-round";


    roundElement.style.position =
        "relative";


    // ------------------------------------------
    // TITLE
    // ------------------------------------------

    const title =
        document.createElement(
            "h3"
        );


    title.textContent =
        getRoundTitle(
            round,
            bracketType
        );


    roundElement.appendChild(
        title
    );


    // ------------------------------------------
    // MATCH CONTAINER
    // ------------------------------------------

    const container =
        document.createElement(
            "div"
        );


    container.className =
        "bracket-round-matches";


    container.style.position =
        "relative";


    matches.forEach(
        function(match) {

            container.appendChild(

                createMatch(
                    match
                )

            );

        }
    );


    roundElement.appendChild(
        container
    );


    return roundElement;

}



// ==========================================
// ROUND TITLES
// ==========================================

function getRoundTitle(
    round,
    bracketType
) {

    const roundNumber =
        Number(
            round
        );


    if (
        bracketType ===
        "winners"
    ) {

        const names = {

            1: "ROUND 1",

            2: "ROUND 2",

            3: "WINNERS FINAL"

        };


        return (
            names[roundNumber] ||
            `ROUND ${roundNumber}`
        );

    }


    if (
        bracketType ===
        "losers"
    ) {

        const names = {

            1: "ROUND 1",

            2: "ROUND 2",

            3: "SEMIFINALS",

            4: "LOSERS FINAL"

        };


        return (
            names[roundNumber] ||
            `ROUND ${roundNumber}`
        );

    }


    return (
        `ROUND ${roundNumber}`
    );

}



// ==========================================
// CREATE MATCH
// ==========================================

function createMatch(
    match
) {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "bracket-match";


    card.dataset.matchId =
        match.MatchID;


    // ------------------------------------------
    // STATUS
    // ------------------------------------------

    const status =
        match.Status ||
        "Upcoming";


    const statusLower =
        status.toLowerCase();


    if (
        statusLower ===
        "complete"
    ) {

        card.classList.add(
            "match-complete"
        );

    }

    else if (
        statusLower ===
        "live"
    ) {

        card.classList.add(
            "match-live"
        );

    }

    else {

        card.classList.add(
            "match-upcoming"
        );

    }


    // ------------------------------------------
    // MATCH HEADER
    // ------------------------------------------

    const header =
        document.createElement(
            "div"
        );


    header.className =
        "match-info";


    const matchLabel =
        document.createElement(
            "span"
        );


    matchLabel.textContent =
        `Match ${match.MatchID}`;


    const statusLabel =
        document.createElement(
            "span"
        );


    statusLabel.textContent =
        status;


    header.appendChild(
        matchLabel
    );


    header.appendChild(
        statusLabel
    );


    card.appendChild(
        header
    );


    // ------------------------------------------
    // TEAM 1
    // ------------------------------------------

    card.appendChild(

        createTeamElement(

            match.Team1 ||
            "TBD",

            match.Score1,

            (
                match.Winner !== "" &&
                match.Winner === match.Team1
            )

        )

    );


    // ------------------------------------------
    // DIVIDER
    // ------------------------------------------

    const divider =
        document.createElement(
            "div"
        );


    divider.className =
        "bracket-divider";


    card.appendChild(
        divider
    );


    // ------------------------------------------
    // TEAM 2
    // ------------------------------------------

    card.appendChild(

        createTeamElement(

            match.Team2 ||
            "TBD",

            match.Score2,

            (
                match.Winner !== "" &&
                match.Winner === match.Team2
            )

        )

    );


    return card;

}



// ==========================================
// CREATE TEAM ROW
// ==========================================

function createTeamElement(
    team,
    score,
    isWinner
) {

    const row =
        document.createElement(
            "div"
        );


    row.className =
        "bracket-team";


    if (
        isWinner
    ) {

        row.classList.add(
            "winner"
        );

    }


    const name =
        document.createElement(
            "span"
        );


    name.textContent =
        team;


    const scoreElement =
        document.createElement(
            "strong"
        );


    scoreElement.textContent =
        score !== ""
            ? score
            : "—";


    row.appendChild(
        name
    );


    row.appendChild(
        scoreElement
    );


    return row;

}



// ==========================================
// GET CARD
// ==========================================

function getCard(
    matchID
) {

    const target =
        normalizeText(
            matchID
        );


    const cards =
        bracketContainer.querySelectorAll(
            ".bracket-match"
        );


    for (
        let i = 0;
        i < cards.length;
        i++
    ) {

        if (
            normalizeText(
                cards[i].dataset.matchId
            ) ===
            target
        ) {

            return cards[i];

        }

    }


    return null;

}



// ==========================================
// FIND INCOMING MATCHES
// ==========================================

function findIncomingMatches(
    targetMatch
) {

    const target =
        normalizeText(
            targetMatch.MatchID
        );


    return currentBracketMatches.filter(
        function(source) {

            return (

                normalizeText(
                    source.NextMatchID
                ) ===
                target ||

                normalizeText(
                    source.LoserNextMatchID
                ) ===
                target

            );

        }
    );

}



// ==========================================
// RESET BRACKET LAYOUT
// ==========================================

function resetBracketLayout() {

    removeOldBracketGraphics();


    bracketContainer
        .querySelectorAll(
            ".bracket-round-matches"
        )
        .forEach(
            function(container) {

                container.style.height =
                    "";


                container
                    .querySelectorAll(
                        ".bracket-match"
                    )
                    .forEach(
                        function(card) {

                            card.style.position =
                                "";

                            card.style.top =
                                "";

                            card.style.left =
                                "";

                            card.style.width =
                                "";

                        }
                    );

            }
        );


    bracketContainer.style.paddingRight =
        "";

}



// ==========================================
// LAYOUT EVERYTHING
// ==========================================

function layoutBrackets() {

    resetBracketLayout();


    requestAnimationFrame(
        function() {

            positionBracket(
                "winners"
            );


            requestAnimationFrame(
                function() {

                    positionBracket(
                        "losers"
                    );


                    requestAnimationFrame(
                        function() {

                            requestAnimationFrame(
                                function() {

                                    drawLocalBracketLines(
                                        "winners"
                                    );


                                    drawLocalBracketLines(
                                        "losers"
                                    );


                                    positionGrandFinal();

                                }
                            );

                        }
                    );

                }
            );

        }
    );

}



// ==========================================
// POSITION ONE BRACKET
// ==========================================

function positionBracket(
    bracketType
) {

    const section =
        bracketContainer.querySelector(
            `.bracket-group[data-bracket="${bracketType}"]`
        );


    if (
        !section
    ) {

        return;

    }


    const rounds =
        Array.from(
            section.querySelectorAll(
                ".bracket-round"
            )
        );


    if (
        rounds.length < 2
    ) {

        return;

    }


    for (
        let i = 1;
        i < rounds.length;
        i++
    ) {

        const round =
            rounds[i];


        const container =
            round.querySelector(
                ".bracket-round-matches"
            );


        if (
            !container
        ) {

            continue;

        }


        const cards =
            Array.from(
                container.querySelectorAll(
                    ".bracket-match"
                )
            );


        let maxBottom =
            0;


        cards.forEach(
            function(card) {

                const match =
                    findMatchByReference(
                        card.dataset.matchId
                    );


                if (
                    !match
                ) {

                    return;

                }


                const incoming =
                    findIncomingMatches(
                        match
                    )
                    .filter(
                        function(source) {

                            return (
                                normalizeText(
                                    source.Bracket
                                ) ===
                                bracketType
                            );

                        }
                    );


                if (
                    !incoming.length
                ) {

                    return;

                }


                const sourceCards =
                    incoming
                        .map(
                            function(source) {

                                return getCard(
                                    source.MatchID
                                );

                            }
                        )
                        .filter(
                            Boolean
                        );


                if (
                    !sourceCards.length
                ) {

                    return;

                }


                const centers =
                    sourceCards.map(
                        function(sourceCard) {

                            const rect =
                                sourceCard
                                    .getBoundingClientRect();


                            return (
                                rect.top +
                                rect.height / 2
                            );

                        }
                    );


                const targetCenter =
                    centers.reduce(
                        function(
                            total,
                            value
                        ) {

                            return (
                                total +
                                value
                            );

                        },
                        0
                    ) /
                    centers.length;


                const containerRect =
                    container.getBoundingClientRect();


                const cardHeight =
                    card.getBoundingClientRect()
                        .height;


                const top =
                    targetCenter -
                    containerRect.top -
                    cardHeight / 2;


                card.style.position =
                    "absolute";


                card.style.top =
                    `${Math.max(
                        0,
                        top
                    )}px`;


                card.style.left =
                    "0";


                card.style.width =
                    "100%";


                maxBottom =
                    Math.max(
                        maxBottom,
                        Math.max(
                            0,
                            top
                        ) +
                        cardHeight
                    );

            }
        );


        if (
            maxBottom > 0
        ) {

            container.style.height =
                `${maxBottom}px`;

        }

    }

}



// ==========================================
// CREATE LOCAL SVG
// ==========================================

function createLocalSVG(
    roundsContainer
) {

    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.classList.add(
        "sc-bracket-local-lines"
    );


    const width =
        roundsContainer.scrollWidth;


    const height =
        roundsContainer.scrollHeight;


    svg.setAttribute(
        "width",
        width
    );


    svg.setAttribute(
        "height",
        height
    );


    svg.setAttribute(
        "viewBox",
        `0 0 ${width} ${height}`
    );


    svg.style.position =
        "absolute";


    svg.style.left =
        "0";


    svg.style.top =
        "0";


    svg.style.width =
        `${width}px`;


    svg.style.height =
        `${height}px`;


    svg.style.pointerEvents =
        "none";


    svg.style.overflow =
        "visible";


    svg.style.zIndex =
        "0";


    roundsContainer.insertBefore(
        svg,
        roundsContainer.firstChild
    );


    return svg;

}



// ==========================================
// DRAW LOCAL BRACKET LINES
// ==========================================
//
// Winners → Winners
// Losers → Losers
//
// No normal cross-bracket lines.
// ==========================================

function drawLocalBracketLines(
    bracketType
) {

    const section =
        bracketContainer.querySelector(
            `.bracket-group[data-bracket="${bracketType}"]`
        );


    if (
        !section
    ) {

        return;

    }


    const roundsContainer =
        section.querySelector(
            ".bracket-rounds"
        );


    if (
        !roundsContainer
    ) {

        return;

    }


    const svg =
        createLocalSVG(
            roundsContainer
        );


    const containerRect =
        roundsContainer.getBoundingClientRect();


    currentBracketMatches.forEach(
        function(source) {

            if (
                normalizeText(
                    source.Bracket
                ) !==
                bracketType
            ) {

                return;

            }


            // --------------------------------------
            // WINNER ROUTE
            // --------------------------------------

            if (
                source.NextMatchID
            ) {

                const target =
                    findMatchByReference(
                        source.NextMatchID
                    );


                if (
                    target &&
                    normalizeText(
                        target.Bracket
                    ) ===
                    bracketType
                ) {

                    drawLocalConnection(
                        svg,
                        source,
                        target,
                        containerRect
                    );

                }

            }


            // --------------------------------------
            // LOSER ROUTE THAT STAYS IN SAME BRACKET
            // --------------------------------------

            if (
                source.LoserNextMatchID
            ) {

                const target =
                    findMatchByReference(
                        source.LoserNextMatchID
                    );


                if (
                    target &&
                    normalizeText(
                        target.Bracket
                    ) ===
                    bracketType
                ) {

                    drawLocalConnection(
                        svg,
                        source,
                        target,
                        containerRect
                    );

                }

            }

        }
    );

}



// ==========================================
// DRAW LOCAL CONNECTION
// ==========================================

function drawLocalConnection(
    svg,
    sourceMatch,
    targetMatch,
    containerRect
) {

    const sourceCard =
        getCard(
            sourceMatch.MatchID
        );


    const targetCard =
        getCard(
            targetMatch.MatchID
        );


    if (
        !sourceCard ||
        !targetCard
    ) {

        return;

    }


    const source =
        getPosition(
            sourceCard,
            containerRect
        );


    const target =
        getPosition(
            targetCard,
            containerRect
        );


    if (
        target.left <=
        source.right
    ) {

        return;

    }


    const gap =
        target.left -
        source.right;


    const midpoint =
        source.right +
        Math.max(
            20,
            gap / 2
        );


    appendPath(

        svg,

        `M ${source.right}
         ${source.centerY}
         H ${midpoint}
         V ${target.centerY}
         H ${target.left}`

    );

}



// ==========================================
// POSITION GRAND FINAL
// ==========================================
//
// Grand Final sits to the right of the
// Winners Final and Losers Final.
// ==========================================

function positionGrandFinal() {

    const winnersFinal =
        findWinnersFinal();


    const losersFinal =
        findLosersFinal();


    if (
        !winnersFinal ||
        !losersFinal
    ) {

        return;

    }


    const winnersCard =
        getCard(
            winnersFinal.MatchID
        );


    const losersCard =
        getCard(
            losersFinal.MatchID
        );


    if (
        !winnersCard ||
        !losersCard
    ) {

        return;

    }


    // ------------------------------------------
    // Remove previous Grand Final
    // ------------------------------------------

    const oldGrandFinal =
        bracketContainer.querySelector(
            ".sc-grand-final"
        );


    if (
        oldGrandFinal
    ) {

        oldGrandFinal.remove();

    }


    const oldLines =
        bracketContainer.querySelector(
            ".sc-grand-final-lines"
        );


    if (
        oldLines
    ) {

        oldLines.remove();

    }


    // ------------------------------------------
    // Create Grand Final
    // ------------------------------------------

    const grandFinal =
        createGrandFinalCard();


    bracketContainer.appendChild(
        grandFinal
    );


    // ------------------------------------------
    // Force layout calculation
    // ------------------------------------------

    const bracketRect =
        bracketContainer.getBoundingClientRect();


    const winnersRect =
        winnersCard.getBoundingClientRect();


    const losersRect =
        losersCard.getBoundingClientRect();


    const grandFinalRect =
        grandFinal.getBoundingClientRect();


    // ------------------------------------------
    // Grand Final width
    //
    // Desktop: 320px
    // Mobile: 240px
    // Small phone: 220px
    // ------------------------------------------

    let grandFinalWidth =
        320;


    if (
        window.innerWidth <= 500
    ) {

        grandFinalWidth =
            220;

    }

    else if (
        window.innerWidth <= 700
    ) {

        grandFinalWidth =
            240;

    }


    grandFinal.style.width =
        `${grandFinalWidth}px`;


    // ------------------------------------------
    // Recalculate after width change
    // ------------------------------------------

    const updatedGrandFinalRect =
        grandFinal.getBoundingClientRect();


    // ------------------------------------------
    // Horizontal gap
    //
    // Desktop: 40px
    // Mobile: 20px
    // ------------------------------------------

    const gap =
        window.innerWidth <= 700
            ? 20
            : 40;


    const rightMost =
        Math.max(
            winnersRect.right,
            losersRect.right
        );


    const left =
        rightMost -
        bracketRect.left +
        gap;


    // ------------------------------------------
    // Center Grand Final between the two
    // final matches.
    // ------------------------------------------

    const winnersCenter =
        winnersRect.top +
        winnersRect.height / 2;


    const losersCenter =
        losersRect.top +
        losersRect.height / 2;


    const combinedCenter =
        (
            winnersCenter +
            losersCenter
        ) /
        2;


    const top =
        combinedCenter -
        bracketRect.top -
        updatedGrandFinalRect.height / 2;


    grandFinal.style.left =
        `${left}px`;


    grandFinal.style.top =
        `${Math.max(
            0,
            top
        )}px`;


    // ------------------------------------------
    // Add only the space needed for the
    // Grand Final.
    // ------------------------------------------

    const requiredWidth =
        left +
        updatedGrandFinalRect.width +
        40;


    if (
        requiredWidth >
        bracketContainer.scrollWidth
    ) {

        bracketContainer.style.paddingRight =
            `${updatedGrandFinalRect.width + gap + 20}px`;

    }
    else {

        bracketContainer.style.paddingRight =
            "";

    }


    // ------------------------------------------
    // Draw final connections after placement.
    // ------------------------------------------

    requestAnimationFrame(
        function() {

            drawGrandFinalConnections(
                winnersCard,
                losersCard,
                grandFinal
            );

        }
    );

}



// ==========================================
// CREATE GRAND FINAL CARD
// ==========================================

function createGrandFinalCard() {

    const card =
        document.createElement(
            "div"
        );


    card.className =
        "bracket-match sc-grand-final";


    card.style.position =
        "absolute";


    card.style.zIndex =
        "4";


    // ------------------------------------------
    // FIND SHEET FINAL ROW
    // ------------------------------------------

    const sheetFinal =
        findGrandFinalSheetMatch();


    // ------------------------------------------
    // FIND CURRENT PARTICIPANTS
    // ------------------------------------------

    const participants =
        getGrandFinalParticipants();


    const team1 =
        participants.winnersTeam ||
        (
            sheetFinal &&
            sheetFinal.Team1
        ) ||
        "TBD";


    const team2 =
        participants.losersTeam ||
        (
            sheetFinal &&
            sheetFinal.Team2
        ) ||
        "TBD";


    const score1 =
        sheetFinal
            ? sheetFinal.Score1
            : "";


    const score2 =
        sheetFinal
            ? sheetFinal.Score2
            : "";


    const status =
        sheetFinal &&
        sheetFinal.Status
            ? sheetFinal.Status
            : "Upcoming";


    const statusLower =
        status.toLowerCase();


    // ------------------------------------------
    // STATUS
    // ------------------------------------------

    if (
        statusLower ===
        "complete"
    ) {

        card.classList.add(
            "match-complete"
        );

    }

    else if (
        statusLower ===
        "live"
    ) {

        card.classList.add(
            "match-live"
        );

    }

    else {

        card.classList.add(
            "match-upcoming"
        );

    }


    // ------------------------------------------
    // MATCH HEADER
    // ------------------------------------------

    const header =
        document.createElement(
            "div"
        );


    header.className =
        "match-info";


    const title =
        document.createElement(
            "span"
        );


    title.textContent =
        "GRAND FINAL";


    const statusElement =
        document.createElement(
            "span"
        );


    statusElement.textContent =
        status;


    header.appendChild(
        title
    );


    header.appendChild(
        statusElement
    );


    card.appendChild(
        header
    );


    // ------------------------------------------
    // WINNERS CHAMPION
    // ------------------------------------------

    card.appendChild(

        createTeamElement(

            team1,

            score1,

            (
                sheetFinal &&
                sheetFinal.Winner ===
                team1
            )

        )

    );


    // ------------------------------------------
    // DIVIDER
    // ------------------------------------------

    const divider =
        document.createElement(
            "div"
        );


    divider.className =
        "bracket-divider";


    card.appendChild(
        divider
    );


    // ------------------------------------------
    // LOSERS CHAMPION
    // ------------------------------------------

    card.appendChild(

        createTeamElement(

            team2,

            score2,

            (
                sheetFinal &&
                sheetFinal.Winner ===
                team2
            )

        )

    );


    return card;

}



// ==========================================
// DRAW GRAND FINAL CONNECTIONS
// ==========================================
//
// ONLY this final stage crosses between
// Winners and Losers.
//
// Winners Final ───────┐
//                      │
//                      ├── Grand Final
//                      │
// Losers Final ────────┘
// ==========================================

function drawGrandFinalConnections(
    winnersCard,
    losersCard,
    grandFinal
) {

    const old =
        bracketContainer.querySelector(
            ".sc-grand-final-lines"
        );


    if (
        old
    ) {

        old.remove();

    }


    const bracketRect =
        bracketContainer.getBoundingClientRect();


    const width =
        Math.max(
            bracketContainer.scrollWidth,
            bracketContainer.offsetWidth
        );


    const height =
        Math.max(
            bracketContainer.scrollHeight,
            bracketContainer.offsetHeight
        );


    const svg =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "svg"
        );


    svg.classList.add(
        "sc-grand-final-lines"
    );


    svg.setAttribute(
        "width",
        width
    );


    svg.setAttribute(
        "height",
        height
    );


    svg.setAttribute(
        "viewBox",
        `0 0 ${width} ${height}`
    );


    svg.style.position =
        "absolute";


    svg.style.left =
        "0";


    svg.style.top =
        "0";


    svg.style.width =
        `${width}px`;


    svg.style.height =
        `${height}px`;


    svg.style.pointerEvents =
        "none";


    svg.style.overflow =
        "visible";


    svg.style.zIndex =
        "3";


    const winners =
        getPosition(
            winnersCard,
            bracketRect
        );


    const losers =
        getPosition(
            losersCard,
            bracketRect
        );


    const finalPosition =
        getPosition(
            grandFinal,
            bracketRect
        );


    // ------------------------------------------
    // Shared routing point
    // ------------------------------------------

    const routeX =
        finalPosition.left -
        35;


    // ------------------------------------------
    // Winners Final → route
    // ------------------------------------------

    appendPath(

        svg,

        `M ${winners.right}
         ${winners.centerY}
         H ${routeX}`

    );


    // ------------------------------------------
    // Losers Final → route
    // ------------------------------------------

    appendPath(

        svg,

        `M ${losers.right}
         ${losers.centerY}
         H ${routeX}`

    );


    // ------------------------------------------
    // Shared vertical section
    // ------------------------------------------

    appendPath(

        svg,

        `M ${routeX}
         ${winners.centerY}
         V ${losers.centerY}`

    );


    // ------------------------------------------
    // Shared midpoint → Grand Final
    // ------------------------------------------

    const mergeY =
        (
            winners.centerY +
            losers.centerY
        ) /
        2;


    appendPath(

        svg,

        `M ${routeX}
         ${mergeY}
         H ${finalPosition.left}`

    );


    // ------------------------------------------
    // Insert behind Grand Final card.
    // ------------------------------------------

    bracketContainer.insertBefore(
        svg,
        grandFinal
    );

}



// ==========================================
// GET POSITION
// ==========================================

function getPosition(
    element,
    containerRect
) {

    const rect =
        element.getBoundingClientRect();


    return {

        left:
            rect.left -
            containerRect.left,

        right:
            rect.right -
            containerRect.left,

        centerY:
            rect.top -
            containerRect.top +
            rect.height / 2

    };

}



// ==========================================
// APPEND SVG PATH
// ==========================================

function appendPath(
    svg,
    pathData
) {

    const path =
        document.createElementNS(
            "http://www.w3.org/2000/svg",
            "path"
        );


    path.setAttribute(
        "d",
        pathData
    );


    path.setAttribute(
        "fill",
        "none"
    );


    path.setAttribute(
        "stroke",
        "rgba(0, 0, 0, 0.30)"
    );


    path.setAttribute(
        "stroke-width",
        "1.5"
    );


    path.setAttribute(
        "stroke-linecap",
        "square"
    );


    path.setAttribute(
        "stroke-linejoin",
        "miter"
    );


    path.setAttribute(
        "vector-effect",
        "non-scaling-stroke"
    );


    path.style.pointerEvents =
        "none";


    svg.appendChild(
        path
    );

}



// ==========================================
// INITIAL LOAD
// ==========================================

loadBracket();



// ==========================================
// AUTO REFRESH
// ==========================================

setInterval(
    function() {

        loadBracket();

    },
    30000
);



// ==========================================
// WINDOW RESIZE
// ==========================================

window.addEventListener(
    "resize",
    function() {

        if (
            !currentBracketMatches.length
        ) {

            return;

        }


        requestAnimationFrame(
            function() {

                layoutBrackets();

            }
        );

    }
);

</script>
